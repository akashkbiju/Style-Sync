<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14141f" />
      <stop offset="100%" stop-color="#050508" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="50%" stop-color="#e11d48" />
      <stop offset="100%" stop-color="#9f1239" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bg)" stroke="#e11d48" stroke-width="6" stroke-opacity="0.3" />
  <g transform="translate(106, 106)" filter="url(#glow)">
    <!-- Scissor blades and handles -->
    <circle cx="60" cy="220" r="42" fill="none" stroke="url(#primaryGrad)" stroke-width="26" />
    <circle cx="240" cy="220" r="42" fill="none" stroke="url(#primaryGrad)" stroke-width="26" />
    <path d="M88 190 L 220 50" stroke="url(#primaryGrad)" stroke-width="26" stroke-linecap="round" />
    <path d="M212 190 L 80 50" stroke="url(#primaryGrad)" stroke-width="26" stroke-linecap="round" />
    <circle cx="150" cy="120" r="14" fill="#ffffff" />
  </g>
</svg>
